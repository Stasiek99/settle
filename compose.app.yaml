# Runs the packaged app next to the database from compose.yaml:
#   docker compose -f compose.yaml -f compose.app.yaml up --build
# Open http://localhost:8081: the web container serves the Angular app and forwards /api to the API, so
# the browser talks to a single origin and the session cookies never cross sites.
# Spring Boot's own Docker Compose support only reads compose.yaml, so this file
# does not affect `./mvnw spring-boot:run`.
services:
  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SETTLE_WEB_PUBLIC_PATH: /api
    ports:
      - '8080:8080'

  web:
    build: ./frontend
    depends_on:
      app:
        condition: service_healthy
    ports:
      - '8081:8080'
