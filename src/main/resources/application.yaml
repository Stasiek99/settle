spring:
  application:
    name: settle

  config:
    import: optional:file:.env[.properties]

  jackson:
    deserialization:
      accept-float-as-int: false

  jpa:
    # Schema is owned by Flyway; Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    # Don't keep the DB session open during view rendering (avoids lazy-loading in controllers).
    open-in-view: false

  flyway:
    enabled: true

settle:
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: settle
      expiration: 15m
    session:
      refresh-expiration: 7d
      # A refresh token that was already rotated is tolerated for this long (two tabs refreshing at once).
      refresh-reuse-grace: 10s
      # Paths as the browser sees them: the SPA reaches the API under /api.
      api-path: /api
      auth-path: /api/auth
      secure-cookies: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

springdoc:
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha
