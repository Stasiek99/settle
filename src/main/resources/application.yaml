server:
  # Behind the web container the socket peer is the proxy; Tomcat takes the client address from the
  # rightmost X-Forwarded-For entry that is not a trusted (private-range) proxy, so a forged header is ignored.
  forward-headers-strategy: native

spring:
  application:
    name: settle

  config:
    import: optional:file:.env[.properties]

  jackson:
    deserialization:
      accept-float-as-int: false

  jpa:
    # Schema is owned by Flyway; Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    # Don't keep the DB session open during view rendering (avoids lazy-loading in controllers).
    open-in-view: false

  flyway:
    enabled: true

settle:
  web:
    # Prefix the browser sees in front of the API when a proxy strips it (the web container maps /api/ to /).
    # Used for the Location header; empty when the API is reached directly.
    public-path: ""
  groups:
    # Balances and suggestions are computed over every member, so a group is capped.
    max-members: 16
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: settle
      expiration: 15m
    session:
      refresh-expiration: 7d
      # A refresh token that was already rotated is tolerated for this long (two tabs refreshing at once).
      refresh-reuse-grace: 10s
      # Paths as the browser sees them: the SPA reaches the API under /api.
      api-path: /api
      auth-path: /api/auth
      secure-cookies: true
    # Counts failed sign-ins in a fixed window that starts at the first failure; at the limit the key is
    # blocked until the window ends. Local to each instance, like the caches.
    login-rate-limit:
      window: 15m
      max-per-client-and-account: 5
      max-per-client: 20
      max-per-account: 30
      max-tracked-keys: 100000
    # Every call counts, per client address. Registration is meant to be rare; a refresh happens about once per
    # access token, so the limit leaves room for several people behind one address.
    rate-limit:
      register:
        window: 1h
        max-per-client: 10
      refresh:
        window: 15m
        max-per-client: 60
      max-tracked-keys: 100000

  cache:
    # In-process (Caffeine): each instance keeps its own copy, so the TTLs bound how stale another
    # instance can be after a write elsewhere. A write evicts the local entry immediately and again after commit.
    memberships:
      # Only positive answers are cached; nobody loses access today, and a new member is never cached as "no".
      ttl: 5m
      max-size: 50000
    balances:
      ttl: 30s
      max-size: 10000
    suggestions:
      ttl: 30s
      max-size: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

springdoc:
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha
