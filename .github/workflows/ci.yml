name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel a still-running build when a newer commit lands on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The workflow only needs to read the repo.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Git on Windows doesn't always keep the executable bit on the wrapper.
      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      # Integration tests start their own Postgres through Testcontainers,
      # which works out of the box because ubuntu runners ship with Docker.
      - name: Build and test
        run: ./mvnw -B -ntp verify
