name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel a still-running build when a newer commit lands on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The workflow only needs to read the repo.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Git on Windows doesn't always keep the executable bit on the wrapper.
      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      # Integration tests start their own Postgres through Testcontainers,
      # which works out of the box because ubuntu runners ship with Docker.
      - name: Build and test
        run: ./mvnw -B -ntp verify

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Check formatting
        run: npx prettier --check src

      - name: Build
        run: npm run build

      - name: Test
        run: npx ng test --watch=false

  # Builds both images and boots them next to Postgres, so a broken Dockerfile or a
  # missing runtime setting is caught here and not on the first deploy.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Create env file from the example
        run: cp .env.example .env

      - name: Build the image and start it with the database
        run: docker compose -f compose.yaml -f compose.app.yaml up --build --wait --wait-timeout 180

      - name: Check the health endpoint
        run: curl --fail --silent http://localhost:8080/actuator/health

      - name: Check that the web container serves the app and forwards the API
        run: |
          curl --fail --silent http://localhost:8081/healthz
          curl --fail --silent http://localhost:8081/ | grep -q '<app-root'
          curl --fail --silent http://localhost:8081/api/actuator/health

      - name: Check the security headers of the web container
        run: |
          curl --silent --head http://localhost:8081/ | grep -i "^content-security-policy: default-src 'self'; script-src 'self'"

      - name: Check that failed logins are rate limited and a forged client address does not help
        run: |
          jar=$(mktemp)
          curl --fail --silent --cookie-jar "$jar" --output /dev/null http://localhost:8081/api/auth/csrf
          token=$(awk '$6 == "XSRF-TOKEN" {print $7}' "$jar")
          attempt() {
            curl --silent --output /dev/null --write-out '%{http_code}' --cookie "$jar" \
              --header "X-XSRF-TOKEN: $token" --header 'Content-Type: application/json' \
              --header "X-Forwarded-For: 10.9.9.$1" \
              --data '{"email":"nobody@example.com","password":"wrong-password"}' \
              http://localhost:8081/api/auth/login
          }
          for i in 1 2 3 4 5; do
            test "$(attempt "$i")" = 401
          done
          test "$(attempt 99)" = 429

      - name: Check that Location headers carry the /api prefix of the web container
        run: |
          jar=$(mktemp)
          api=http://localhost:8081/api
          curl --fail --silent --cookie-jar "$jar" --output /dev/null $api/auth/csrf
          token=$(awk '$6 == "XSRF-TOKEN" {print $7}' "$jar")
          post() {
            curl --fail --silent --cookie "$jar" --cookie-jar "$jar" --header "X-XSRF-TOKEN: $token" \
              --header 'Content-Type: application/json' --data "$2" "${@:3}" "$api$1"
          }
          post /auth/register '{"email":"ci@example.com","displayName":"Ci","password":"correct-horse-battery"}' --output /dev/null
          post /auth/login '{"email":"ci@example.com","password":"correct-horse-battery"}' --output /dev/null
          token=$(awk '$6 == "XSRF-TOKEN" {print $7}' "$jar")
          location=$(post /groups '{"name":"Trip","currency":"EUR"}' --dump-header - --output /dev/null \
            | tr -d '\r' | awk 'tolower($1) == "location:" {print $2}')
          echo "Location: $location"
          [[ "$location" == /api/groups/* ]]
          curl --fail --silent --cookie "$jar" --output /dev/null "http://localhost:8081$location"

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f compose.yaml -f compose.app.yaml logs

      - name: Stop containers
        if: always()
        run: docker compose -f compose.yaml -f compose.app.yaml down --volumes
