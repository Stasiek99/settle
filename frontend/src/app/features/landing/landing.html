<app-background-paths title="Settle">
  <p class="landing__tagline">
    Split expenses with friends and settle up, without the spreadsheet.
  </p>

  <div class="landing__actions">
    <a
      pButton
      routerLink="/register"
      label="Get started"
      icon="pi pi-arrow-right"
      iconPos="right"
      size="large"
    ></a>
    <a
      pButton
      routerLink="/login"
      label="Sign in"
      severity="secondary"
      [outlined]="true"
      size="large"
    ></a>
  </div>
</app-background-paths>
