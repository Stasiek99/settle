<main class="status">
  <p-card header="Settle" subheader="Split expenses, settle up.">
    <div class="status__row">
      <span>API</span>
      @switch (state()) {
        @case ('up') {
          <p-tag severity="success" value="UP" icon="pi pi-check" />
        }
        @case ('down') {
          <p-tag severity="danger" value="DOWN" icon="pi pi-times" />
        }
        @default {
          <p-tag severity="secondary" value="CHECKING" icon="pi pi-spin pi-spinner" />
        }
      }
    </div>

    <ng-template #footer>
      <p-button
        label="Check again"
        icon="pi pi-refresh"
        severity="secondary"
        [loading]="state() === 'checking'"
        (onClick)="check()"
      />
    </ng-template>
  </p-card>
</main>
